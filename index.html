<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品集 - 示例</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="preload">
  <header class="site-header">
    <div class="container">
      <h1 class="logo" data-i18n="logo">陆世明的作品集</h1>
      <button id="navToggle" class="nav-toggle" aria-expanded="false">☰</button>
      <nav id="mainNav" class="main-nav" aria-label="主导航">
        <ul>
          <li><a href="#home" data-i18n="nav.home">首页</a></li>
          <li><a href="#projects" data-i18n="nav.projects">项目</a></li>
          <li><a href="#about" data-i18n="nav.about">关于</a></li>
          <li><a href="#contact" data-i18n="nav.contact">联系</a></li>
        </ul>
      </nav>
      <div class="header-controls" aria-hidden="false">
        <button id="themeToggle" class="theme-toggle" aria-pressed="false" title="切换深色/浅色">🌙</button>
        <label for="langSelect" class="visually-hidden">语言</label>
        <select id="langSelect" class="lang-select" aria-label="选择语言">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="container">
        <h2 data-i18n="hero.title">你好，我是开发者</h2>
        <p data-i18n="hero.lead">这是一个简单的响应式作品集示例页面。</p>
        <a class="cta" href="#projects" data-i18n="hero.cta">查看我的作品</a>
      </div>
    </section>
    
      </div>
    </section>

    <section id="projects" class="projects container">
      <h3 data-i18n="projects.title">精选项目</h3>
      <div class="grid">
        <article class="card">
          <img src="images/project1.jpg" alt="项目 1 示例图">
          <h4 data-i18n="project1.title">项目一</h4>
          <p data-i18n="project1.desc">项目一的简短描述。</p>
        </article>
        <article class="card">
          <img src="images/project2.jpg" alt="项目 2 示例图">
          <h4 data-i18n="project2.title">项目二</h4>
          <p data-i18n="project2.desc">项目二的简短描述。</p>
        </article>
        <article class="card">
          <img src="images/project3.jpg" alt="项目 3 示例图">
          <h4 data-i18n="project3.title">项目三</h4>
          <p data-i18n="project3.desc">项目三的简短描述。</p>
        </article>
      </div>
    </section>

    <section id="about" class="about container">
      <h3 data-i18n="about.title">关于我</h3>
      <p data-i18n="about.lead">一段关于作者的简短介绍，技能、背景等。</p>
    </section>

    <section id="contact" class="contact container">
      <h3 data-i18n="contact.title">联系我</h3>
      <div class="contact-grid">
        <form id="contactForm">
        <label for="name" data-i18n="contact.name.label">姓名</label>
        <input id="name" name="name" type="text" required>

        <label for="email" data-i18n="contact.email.label">邮箱</label>
        <input id="email" name="email" type="email" required>

        <label for="message" data-i18n="contact.message.label">信息</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit" data-i18n="contact.send">发送</button>
      </form>
        <aside class="contact-info" aria-label="联系信息">
          <h4 data-i18n="contact.direct">直接联系</h4>
          <p><span data-i18n="contact.email">邮箱:</span> <a href="mailto:137899302@qq.com">137899302@qq.com</a></p>
          <p><span data-i18n="contact.phone">电话:</span> <a href="tel:+8613888888888">+86 13888888888</a></p>
          <p><span data-i18n="contact.address">地址:</span> <address>学院路 1号<br>广东省中山市石岐区<br>中国</address></p>
          <div class="social-links" aria-label="社交媒体">
            <a href="https://github.com/" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">🐙 GitHub</a>
            <a href="https://www.linkedin.com/" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn">💼 LinkedIn</a>
            <a href="https://twitter.com/" target="_blank" rel="noopener" title="Twitter" aria-label="Twitter">🐦 Twitter</a>
          </div>
        </aside>
      </div>

      <div id="formStatus" aria-live="polite"></div>
    </section>


        <section id="map" class="map container">
      <h3 data-i18n="map.title">位置</h3>
      <div class="map-wrapper">
        <iframe src="https://www.google.com/maps?q=学院路+1号+中山市+石岐区+中国&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" aria-label="地图 — 学院路 1号"></iframe>
  <p class="map-link"><a data-i18n="map.open" href="https://www.google.com/maps?q=学院路+1号+中山市+石岐区+中国" target="_blank" rel="noopener">在地图中打开</a></p>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 陆世明。保留所有权利。</p>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
